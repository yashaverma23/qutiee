<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>A Letter for You 💌</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="overlay">

        <div class="envelope-wrapper">
            <div class="envelope" onclick="openEnvelope()">
                <div class="envelope-top"></div>
                <div class="envelope-body">
                    <p class="envelope-text">Click to open 💌</p>
                </div>
            </div>
        </div>

        <div class="letter" id="letter">
            <h2>My Love 💖</h2>
            <p id="letterText"></p>
            <div class="buttons" style="justify-content: center; display: none;" id="letterButtons">
                <button id="nextBtn" onclick="goNext()" style="display: inline-block;">Next 💖</button>
                <button id="noFinal" class="no-btn" style="display: inline-block;">NO 😏</button>
            </div>
        </div>

    </div>

    <script src="paction.js"></script>
</body>

</html>
